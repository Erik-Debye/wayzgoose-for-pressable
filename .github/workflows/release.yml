# Builds installers for macOS and Windows and attaches them to a GitHub
# Release whenever a version tag (v1.2.3) is pushed. Nothing runs on your
# own machine: push the tag, wait a few minutes, download from Releases.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version: the build stamps package.json with it, so the
# app, the installer filenames and the release all agree even if you forgot
# to bump package.json. A manual run (Actions → Run workflow) builds from
# package.json's version and publishes a draft release instead.
#
# Signing is optional. Without certificates the installers still build and
# run, but macOS and Windows show their "unidentified developer" prompts.
# To sign, add these secrets in Settings → Secrets and variables → Actions:
#   macOS:   CSC_LINK (base64 .p12), CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release once, before the builds start. Without this, the
  # macOS and Windows jobs can both see "no release for this tag yet" and
  # each create one, leaving two releases with the assets split between them.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the GitHub release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; the builds will upload to it."
          else
            NOTES="$(git tag -l --format='%(contents)' "$TAG")"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "${TAG#v}" --notes "${NOTES:-Release $TAG}" --verify-tag
          fi

  build:
    needs: release
    # Run after the release job, or straight away for a manual (untagged) run,
    # where the release job is skipped and the build publishes a draft.
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # electron-builder treats an empty CSC_LINK as a certificate path, so
      # signing variables are only exported when the secrets actually exist.
      - name: Configure code signing
        shell: bash
        env:
          S_CSC_LINK: ${{ secrets.CSC_LINK }}
          S_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          S_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          S_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          put() { { echo "$1<<__EOF__"; echo "$2"; echo "__EOF__"; } >> "$GITHUB_ENV"; }
          EXTRA=""
          if [ -n "$S_CSC_LINK" ]; then
            put CSC_LINK "$S_CSC_LINK"
            put CSC_KEY_PASSWORD "$S_CSC_KEY_PASSWORD"
            echo "macOS signing certificate configured"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No macOS signing certificate; building unsigned"
          fi
          if [ -n "$S_WIN_CSC_LINK" ]; then
            put WIN_CSC_LINK "$S_WIN_CSC_LINK"
            put WIN_CSC_KEY_PASSWORD "$S_WIN_CSC_KEY_PASSWORD"
            echo "Windows signing certificate configured"
          fi
          if [ -n "$S_APPLE_ID" ] && [ -n "$S_CSC_LINK" ]; then
            put APPLE_ID "$S_APPLE_ID"
            put APPLE_APP_SPECIFIC_PASSWORD "$S_APPLE_APP_SPECIFIC_PASSWORD"
            put APPLE_TEAM_ID "$S_APPLE_TEAM_ID"
            EXTRA="$EXTRA --config.mac.notarize=true"
            echo "macOS notarization configured"
          fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            EXTRA="$EXTRA --config.publish.releaseType=draft"
          fi
          # Always publish to the repository this workflow runs in, whatever
          # package.json says, and bake the same target into the updater.
          EXTRA="$EXTRA --config.publish.owner=$GITHUB_REPOSITORY_OWNER --config.publish.repo=${GITHUB_REPOSITORY#*/}"
          echo "EXTRA_ARGS=$EXTRA" >> "$GITHUB_ENV"

      - name: Build and publish installers
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish always $EXTRA_ARGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fail loudly if a release ends up without one of its installers. electron-
  # builder can lose an upload without failing the job, which is how a
  # release once shipped with no Windows installer.
  verify:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check the release has every expected file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$ASSETS"
          MISSING=""
          for f in \
            "Wayzgoose-for-Pressable-$VERSION-Setup.exe" \
            "Wayzgoose-for-Pressable-$VERSION-arm64.dmg" \
            "Wayzgoose-for-Pressable-$VERSION-x64.dmg" \
            "Wayzgoose-for-Pressable-$VERSION-arm64.zip" \
            "Wayzgoose-for-Pressable-$VERSION-x64.zip" \
            "latest.yml" \
            "latest-mac.yml"; do
            echo "$ASSETS" | grep -qx "$f" || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Release $TAG is missing:$MISSING"
            exit 1
          fi
          echo "All expected files are attached to $TAG."
